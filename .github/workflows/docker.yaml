name: Build & Push Docker Image

on:
  push:
    branches:
      - "master"
  workflow_dispatch:
    inputs:
      overwrite_version_tag:
        description: "Écraser le tag de version s'il existe déjà sur ghcr.io"
        type: boolean
        default: false

# Deux pushes rapprochés ne doivent pas publier chacun le tag de version.
concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from version.txt
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d ' \n')
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag de version est immuable : il n'est publié qu'une seule fois, au
      # premier build de cette version. Les builds suivants sur master ne mettent
      # à jour que latest (sauf écrasement demandé explicitement).
      - name: Check if version tag already exists
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          OVERWRITE: ${{ inputs.overwrite_version_tag || false }}
        run: |
          {
            echo "tags<<EOF"
            if [ "$OVERWRITE" = "true" ] || ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              echo "Publication du tag de version $VERSION" >&2
              echo "$IMAGE:$VERSION"
            else
              echo "Le tag $VERSION existe déjà : seul latest est mis à jour" >&2
            fi
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64  # linux/arm64 peut être rajouté plus tard
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}